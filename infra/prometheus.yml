global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
