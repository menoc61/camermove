global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:4001"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

rule_files:
  - "alerts.yml"
