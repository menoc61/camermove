services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: camermove
      POSTGRES_PASSWORD: camermove
      POSTGRES_DB: camermove
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camermove"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]

  kafka:
    image: bitnamilegacy/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["127.0.0.1:9092:9092"]

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [kafka]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    volumes: ["grafanadata:/var/lib/grafana"]

  # ── App (containerised) ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://camermove:camermove@postgres:5432/camermove
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio
      API_URL: http://api:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }
      minio: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://camermove:camermove@postgres:5432/camermove
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3002:3000"]
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3002
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
  grafanadata:
